<div
  class="cee-term-link"
  [class.cee-term-link-single-line]="truncateLabel"
  attr.aria-label="{{ fieldLabel }}"
>
  <!-- Optional authority branding belongs immediately before the value it identifies. -->
  <span class="cee-term-link-prefix"><ng-content select="[termLinkPrefix]"></ng-content></span>
  @if (label) {
    <span class="cee-term-link-label" [attr.title]="truncateLabel ? label : null">{{ label }}</span>
  }
  @if (iri) {
    @if (label) {
      <span class="cee-term-link-dash" aria-hidden="true">-</span>
    }
    @if (isAddressable) {
      <a class="cee-term-link-iri" [href]="iri" target="_blank" rel="noopener">{{ iri }}</a>
    } @else {
      <span class="cee-term-link-iri">{{ iri }}</span>
    }
  }
  <!-- The widget's own link-out, which knows which authority it addresses. -->
  <span class="cee-term-link-suffix"><ng-content></ng-content></span>
</div>
