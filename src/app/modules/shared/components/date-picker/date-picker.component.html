@if (dateFormat === yearFormat) {
  <mat-form-field>
    <!--    <mat-label>Select Year</mat-label>-->
    <input
      spellcheck="false"
      autocomplete="off"
      matInput
      readonly
      [placeholder]="dateNotation | translate"
      [matDatepicker]="dp"
      [formControl]="dateMonthYear"
      [attr.aria-labelledby]="boxName.id"
    />
    <!--
      No requirement of its own. The year template alone used to carry one, with a
      `mat-error` the month and day templates never had, over a validator that also
      outlined the box red on its own — while the temporal field below states the
      same requirement once, for the whole row.
    -->
    @if (!readOnlyMode) {
      <mat-datepicker-toggle matSuffix [for]="dp" [attr.lang]="materialLanguage"
        ><mat-icon matDatepickerToggleIcon cedarIcon="field-date"></mat-icon
      ></mat-datepicker-toggle>
    }
    <mat-datepicker
      #dp
      (yearSelected)="chosenYearHandler($event, dp)"
      (opened)="calendarOpened()"
      (closed)="datepickerClosed()"
      [restoreFocus]="false"
      startView="multi-year"
      panelClass="year-month-picker"
    ></mat-datepicker>
  </mat-form-field>
}
@if (dateFormat === yearMonthFormat) {
  <mat-form-field>
    <!--    <mat-label>Select Year and Month</mat-label>-->
    <input
      spellcheck="false"
      autocomplete="off"
      matInput
      readonly
      [placeholder]="dateNotation | translate"
      [matDatepicker]="dp"
      [formControl]="dateMonthYear"
      [attr.aria-labelledby]="boxName.id"
    />
    @if (!readOnlyMode) {
      <mat-datepicker-toggle matSuffix [for]="dp" [attr.lang]="materialLanguage"
        ><mat-icon matDatepickerToggleIcon cedarIcon="field-date"></mat-icon
      ></mat-datepicker-toggle>
    }
    <mat-datepicker
      #dp
      (yearSelected)="chosenYearHandler($event, dp)"
      (monthSelected)="chosenMonthHandler($event, dp)"
      (opened)="calendarOpened()"
      (closed)="datepickerClosed()"
      [restoreFocus]="false"
      startView="multi-year"
      panelClass="year-month-picker"
    ></mat-datepicker>
  </mat-form-field>
}
@if (dateFormat === yearMonthDayFormat) {
  <mat-form-field>
    <!--    <mat-label>Select Date</mat-label>-->
    <input
      spellcheck="false"
      autocomplete="off"
      matInput
      readonly
      [placeholder]="dateNotation | translate"
      [matDatepicker]="dp"
      [formControl]="dateMonthYear"
      (dateChange)="chosenDateHandler($event)"
      [attr.aria-labelledby]="boxName.id"
    />
    @if (!readOnlyMode) {
      <mat-datepicker-toggle matSuffix [for]="dp" [attr.lang]="materialLanguage"
        ><mat-icon matDatepickerToggleIcon cedarIcon="field-date"></mat-icon
      ></mat-datepicker-toggle>
    }
    <!-- `(dateChange)` above is what carries the chosen date. `(opened)` emits
    nothing, so it carries no date: it only prepares the calendar for assistive technology. -->
    <mat-datepicker
      #dp
      (opened)="calendarOpened()"
      (closed)="datepickerClosed()"
      [restoreFocus]="false"
    ></mat-datepicker>
  </mat-form-field>
}
<!--
  The box's name joins the field's label to CEE's words and states each in its own language. Only one
  of the three formats is drawn, so one name serves all three.
-->
<span appCedarJoinedName #boxName [key]="nameKey" [label]="fieldLabel" [labelLanguage]="labelLanguage"></span>
