@if (dateFormat === yearFormat) {
  <mat-form-field>
    <!--    <mat-label>Select Year</mat-label>-->
    <input
      matInput
      readonly
      [matDatepicker]="dp"
      [formControl]="dateMonthYear"
      attr.aria-label="{{ 'Generic.SelectYear' | translate }}"
    />
    @if (dateMonthYear.getError('required')) {
      <mat-error class="mat-error align-start">{{ 'Error.ValueRequired' | translate }}</mat-error>
    }
    <mat-datepicker-toggle matSuffix [for]="dp"></mat-datepicker-toggle>
    <mat-datepicker
      #dp
      (yearSelected)="chosenYearHandler($event, dp)"
      (closed)="datepickerClosed()"
      [restoreFocus]="false"
      startView="multi-year"
      panelClass="year-month-picker"
    ></mat-datepicker>
  </mat-form-field>
}
@if (dateFormat === yearMonthFormat) {
  <mat-form-field>
    <!--    <mat-label>Select Year and Month</mat-label>-->
    <input
      matInput
      readonly
      [matDatepicker]="dp"
      [formControl]="dateMonthYear"
      attr.aria-label="{{ 'Generic.SelectYearAndMonth' | translate }}"
    />
    @if (!readOnlyMode) {
      <mat-datepicker-toggle matSuffix [for]="dp"></mat-datepicker-toggle>
    }
    <mat-datepicker
      #dp
      (yearSelected)="chosenYearHandler($event, dp)"
      (monthSelected)="chosenMonthHandler($event, dp)"
      (closed)="datepickerClosed()"
      [restoreFocus]="false"
      startView="multi-year"
      panelClass="year-month-picker"
    ></mat-datepicker>
  </mat-form-field>
}
@if (dateFormat === yearMonthDayFormat) {
  <mat-form-field>
    <!--    <mat-label>Select Date</mat-label>-->
    <input
      matInput
      readonly
      [matDatepicker]="dp"
      [formControl]="dateMonthYear"
      (dateChange)="chosenDateHandler($event)"
      attr.aria-label="{{ 'Generic.SelectDate' | translate }}"
    />
    @if (!readOnlyMode) {
      <mat-datepicker-toggle matSuffix [for]="dp"></mat-datepicker-toggle>
    }
    <!-- `(dateChange)` above is what carries the chosen date. `(opened)` emits
    nothing, so binding the same handler to it passed `undefined` and the body
    never ran; removed rather than left looking live. -->
    <mat-datepicker #dp (closed)="datepickerClosed()" [restoreFocus]="false"></mat-datepicker>
  </mat-form-field>
}
