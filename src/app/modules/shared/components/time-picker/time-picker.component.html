@if (!readOnlyMode) {
  <div class="cee-time-picker" role="group" attr.aria-label="{{ 'Generic.Time' | translate }}">
    <div class="cee-time-input-shell">
      <input
        class="cee-time-segment"
        type="text"
        inputmode="numeric"
        maxlength="2"
        [value]="hasValue ? hourText : ''"
        placeholder="HH"
        (input)="hourChanged($any($event.target).value)"
        (keydown)="segmentKeydown($event, 'hour')"
        attr.aria-label="{{ 'Generic.Hour' | translate }}"
      />
      @if (!disableMinute) {
        <span class="cee-time-separator" aria-hidden="true">:</span>
        <input
          class="cee-time-segment"
          type="text"
          inputmode="numeric"
          maxlength="2"
          [value]="hasValue ? minuteText : ''"
          placeholder="MM"
          (input)="minuteChanged($any($event.target).value)"
          (keydown)="segmentKeydown($event, 'minute')"
          attr.aria-label="{{ 'Generic.Minute' | translate }}"
        />
        @if (showSeconds) {
          <span class="cee-time-separator" aria-hidden="true">:</span>
          <input
            class="cee-time-segment"
            type="text"
            inputmode="numeric"
            maxlength="2"
            [value]="hasValue ? secondText : ''"
            placeholder="SS"
            (input)="secondChanged($any($event.target).value)"
            (keydown)="segmentKeydown($event, 'second')"
            attr.aria-label="{{ 'Generic.Second' | translate }}"
          />
        }
      }
    </div>
    @if (enableMeridian) {
      <button
        type="button"
        mat-stroked-button
        class="cee-time-meridian"
        (click)="toggleMeridian()"
        attr.aria-label="{{ 'Generic.ToggleMeridian' | translate }}"
      >
        {{ meridian }}
      </button>
    }
  </div>
}

@if (readOnlyMode) {
  <span class="cee-time-picker-readonly" attr.aria-label="{{ 'Generic.Time' | translate }}">
    {{ hasValue ? displayValue : '' }}
  </span>
}
