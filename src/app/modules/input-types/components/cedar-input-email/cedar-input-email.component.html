<form class="form-container" [formGroup]="options">
  <mat-form-field class="full-width">
    <!--    <mat-label>{{cds.getRenderingLabelForComponent(component)}}</mat-label>-->
    <input
      spellcheck="false"
      matInput
      type="text"
      [placeholder]="readOnlyMode ? (component | ceeSpecPlaceholder) : ''"
      [formControl]="inputValueControl"
      (input)="inputChanged($event)"
      [readonly]="readOnlyMode"
      attr.aria-label="{{ cds.getRenderingLabelForComponent(component) }}"
    />
    @if (inputValueControl.value && !readOnlyMode) {
      <button
        type="button"
        matSuffix
        mat-icon-button
        attr.aria-label="{{ 'Generic.Clear' | translate }}"
        (click)="clearValue()"
      >
        <mat-icon cedarIcon="close"></mat-icon>
      </button>
    }
    @if (inputValueControl.getError('email') && !readOnlyMode) {
      <mat-error class="mat-error align-start">{{ 'Validation.Email.Invalid' | translate }}</mat-error>
    }
    @if (inputValueControl.getError('required') && !readOnlyMode) {
      <mat-error class="mat-error align-start">{{ 'Validation.Required' | translate }}</mat-error>
    }
  </mat-form-field>
</form>
