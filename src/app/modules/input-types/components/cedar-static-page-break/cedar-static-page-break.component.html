<div class="pager-container page-break-paginator-container">
  <span class="page-break-label">{{ 'Generic.Page' | translate }}:</span>
  <div class="pager-chips">
    <mat-chip-listbox [hideSingleSelectionIndicator]="true" [attr.aria-label]="'Generic.Page' | translate">
      @for (pageNumber of pageBreakPaginatorService.allPageIndices(); track pageNumber) {
        <!--
          Selection rather than a click turns the page, because Material's chip selects on Enter
          and Space without dispatching one.
        -->
        <mat-chip-option
          [selected]="pageNumber === pageBreakPaginatorService.currentPageBreakIndex"
          (selectionChange)="pageChipSelected($event, pageNumber)"
          (keydown)="moveChipFocus($event)"
          selectable="true"
          >{{ pageNumber + 1 }}</mat-chip-option
        >
      }
    </mat-chip-listbox>
  </div>
  <div class="page-break-pager">
    <mat-paginator
      [attr.lang]="materialLanguage"
      [length]="pageBreakPaginatorService.numPages()"
      [hidePageSize]="true"
      [pageSize]="1"
      [pageIndex]="pageBreakPaginatorService.currentPageBreakIndex"
      (page)="paginatorChanged($event)"
    >
    </mat-paginator>
  </div>
</div>
