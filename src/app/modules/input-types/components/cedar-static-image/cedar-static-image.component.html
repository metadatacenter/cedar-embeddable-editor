<mat-card appearance="outlined" class="image-component">
  @if (view.src) {
    <div role="img" attr.aria-label="{{ altText }}">
      <img
        mat-card-image
        [src]="view.src"
        [alt]="altText"
        [attr.width]="size.width"
        [attr.height]="size.height"
        (error)="onImageError()"
      />
    </div>
  }
  @if (view.error) {
    <p class="image-error" role="alert">{{ view.error.key | translate: view.error.params }}</p>
  }
  @if (component.labelInfo.description) {
    <mat-card-content>
      <p>{{ component.labelInfo.description }}</p>
    </mat-card-content>
  }
</mat-card>
