@if (readOnlyMode) {
  <mat-form-field class="full-width">
    <input
      matInput
      type="text"
      readonly
      [value]="readOnlyValue()"
      [placeholder]="component | ceeSpecPlaceholder"
      attr.aria-label="{{ component.labelInfo.label }}"
    />
  </mat-form-field>
}

@if (!readOnlyMode) {
  @if (showDatePicker()) {
    <div class="cee-temporal-date">
      <app-date-picker
        [dateFormat]="dateFormat()"
        (dateChangedEvent)="dateInputChanged($event)"
        [dateMonthYear]="dateMonthYearControl"
        [required]="required"
        xmlns="http://www.w3.org/1999/html"
      ></app-date-picker>
    </div>
  }

  @if (showTimePicker()) {
    <div class="cee-temporal-time">
      <app-time-picker
        [(ngModel)]="timePickerTime"
        (ngModelChange)="timeInputChanged($event)"
        [enableMeridian]="enableMeridian()"
        [disableMinute]="disableMinute()"
        [showSeconds]="showSeconds()"
      >
      </app-time-picker>

      @if (showDecimalSeconds()) {
        <span class="cee-fraction-separator" aria-hidden="true">.</span>
        <!--
        The placeholder is `sss`, not `000`, because a placeholder must not look
        like a value.

        At this granularity the fraction is a required part — `CedarTemporalValue.isComplete`
        asks for it — so an empty box means the field records nothing at all. And
        `000` is simultaneously a valid value, recording zero. The one state that
        saves nothing therefore looked exactly like the state that saves zero, in
        grey: date and time filled, a grey `000`, and a null value.

        Every other placeholder in this control is letters for that reason: `HH`,
        `MM`, `SS`. Lowercase here so it reads as sub-second beside the uppercase
        `SS`, which is the usual notation for `HH:MM:SS.sss`.
      -->
        <mat-form-field class="cee-fraction-field">
          <input
            matInput
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            (input)="decimalSecondsChanged($event)"
            [(ngModel)]="decimalSeconds"
            name="decimalSeconds"
            placeholder="sss"
            matTooltip="{{ 'Generic.DecimalSeconds' | translate }}"
            attr.aria-label="{{ 'Generic.SelectDecimalSeconds' | translate }}"
          />
        </mat-form-field>
      }
    </div>
  }

  @if (showTimezonePicker()) {
    <div class="cee-temporal-offset">
      <app-timezone-picker
        [(ngModel)]="timezone"
        (ngModelChange)="timezoneInputChanged($event)"
        customPlaceholderText="{{ 'Generic.SelectUtcOffset' | translate }}"
        [getUserZone]="setDefaultZone"
      ></app-timezone-picker>
    </div>
  }

  @if (hasTemporalValue() && !readOnlyMode) {
    <button
      type="button"
      mat-icon-button
      class="cee-temporal-clear"
      attr.aria-label="{{ 'Generic.Clear' | translate }}"
      matTooltip="{{ 'Generic.Clear' | translate }}"
      (click)="clearValue()"
    >
      <mat-icon>close</mat-icon>
    </button>
  }

  @if (showsValidationMessage) {
    <mat-error class="mat-error align-start cee-temporal-error">
      {{ validationMessage() }}
    </mat-error>
  }
}
