<form class="form-container" [formGroup]="options">
  @for (choice of component.choiceInfo.choices; track choice) {
    <div>
      <mat-checkbox
        color="primary"
        (input)="inputChanged($event)"
        [tabIndex]="readOnlyMode ? -1 : 0"
        [attr.aria-disabled]="readOnlyMode ? true : null"
        [formControlName]="controlNameFor($index)"
        [value]="choice.label"
        >{{ choice.label }}
        @if (handlerContext.statesSpecification && choice.selectedByDefault) {
          <span class="choice-default-mark">{{ 'Spec.DefaultMark' | translate }}</span>
        }
      </mat-checkbox>
    </div>
  }
  <!--
    Outside a `mat-form-field`, because a group of options is not one control with
    a box around it. The datetime widget states its own errors the same way, for
    the same reason.
  -->
  @if (showsRequiredError) {
    <mat-error class="mat-error align-start cee-checkbox-error">{{
      'Validation.SelectAtLeastOne' | translate
    }}</mat-error>
  }
</form>
