<form class="form-container" [formGroup]="options">
  @for (choice of component.choiceInfo.choices; track choice) {
    <div>
      <mat-checkbox
        color="primary"
        (input)="inputChanged($event)"
        [formControlName]="getFormControlName(choice.label)"
        [value]="choice.label"
        >{{ choice.label }}</mat-checkbox
      >
    </div>
  }
</form>
