name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - cee-with-model-library
      - cee-angular-upgrade
      - 'cee-angular-**'

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The committed Playwright snapshots are macOS baselines, so this label is pinned
    # rather than tracking macos-latest: a runner bump would move them underneath us.
    #
    # Not macos-14. Playwright no longer builds WebKit for mac14-arm64 and serves a
    # frozen v2251 there, while 1.62.1 drives v2336. The driver sends
    # `Page.overrideSetting: PushAPIEnabled`, v2251 does not implement it, and every
    # newPage() in the webkit-smoke project fails. Playwright's own install warning is
    # "please update to the latest version of your operating system".
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out CEE
        uses: actions/checkout@v4
        with:
          path: cedar-embeddable-editor

      # One Node for the whole job, which Angular 14 could not give us.
      #
      # This job used to build on Node 16 and then switch the runner to Node 20 to
      # test, because Angular 14's toolchain did not support the version Playwright
      # needs. Angular 15 accepts ">=18.10.0", so the split has no reason left and
      # the build and the tests now share one version — which also means the dist
      # that ships is produced on the same Node that exercised it.
      #
      # 20.20.2 carried the march to 21: Angular 17 wanted ">=20.9.0", 18 and 19
      # "^20.11.1", 20 and 21 "^20.19.0". Angular 22 requires "^22.22.3 ||
      # ^24.15.0 || >=26", so this is where it moved, as the previous note said it
      # would have to.
      #
      # 24, not 22, of the two the range allows: 24 is the active LTS and 22 is in
      # maintenance, so this is the version with the longer life rather than the
      # smaller number. 26 does not exist yet.
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: |
            cedar-embeddable-editor/package-lock.json
            cedar-embeddable-editor/harness/package-lock.json
            cedar-embeddable-editor/visual/package-lock.json

      - name: Install Angular build dependencies
        working-directory: cedar-embeddable-editor
        run: npm ci

      - name: Build the production web component
        working-directory: cedar-embeddable-editor
        run: npm run build:production

      # The root `npm ci` is already done above; only the two test workspaces are
      # left, now that the runner no longer changes Node underneath them.
      - name: Install CEE test dependencies
        working-directory: cedar-embeddable-editor
        run: |
          npm --prefix harness ci
          npm --prefix visual ci
          ./visual/node_modules/.bin/playwright install chromium firefox webkit

      - name: Test the production artifact built above
        working-directory: cedar-embeddable-editor
        run: npm run test:ci:prebuilt

      # Deliberately its own step, and deliberately not part of `test:ci`.
      #
      # This is the one check that can start failing without anyone having changed
      # anything: it fails on a disclosure, not on a commit. Inside the gate that
      # would break an unrelated pull request with an error its author cannot fix
      # there, and — worse — would train people to expect a red gate for reasons
      # that are not theirs. As its own step the build still fails, which is the
      # point, and the reason is legible from the job summary alone.
      #
      # After the tests, so a genuine regression is reported first.
      #
      # `--omit=dev` because only runtime dependencies reach the bundle an embedder
      # downloads; the Angular CLI's own tree is a hazard to this machine, not to
      # anyone consuming CEE. `--audit-level=high` because moderate advisories
      # against build tooling are not worth stopping a release for, and the whole
      # value of this step is that a failure means something.
      - name: Audit what ships
        working-directory: cedar-embeddable-editor
        run: npm run audit:prod
