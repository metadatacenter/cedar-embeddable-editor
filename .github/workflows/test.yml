name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - cee-with-model-library

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The committed Playwright snapshots are macOS baselines, so this label is pinned
    # rather than tracking macos-latest: a runner bump would move them underneath us.
    #
    # Not macos-14. Playwright no longer builds WebKit for mac14-arm64 and serves a
    # frozen v2251 there, while 1.62.1 drives v2336. The driver sends
    # `Page.overrideSetting: PushAPIEnabled`, v2251 does not implement it, and every
    # newPage() in the webkit-smoke project fails. Playwright's own install warning is
    # "please update to the latest version of your operating system".
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out CEE
        uses: actions/checkout@v4
        with:
          path: cedar-embeddable-editor

      # Angular 14 supports Node 14 and 16, but not the Node 20 required by the
      # current Playwright installation. Compile once on a supported Angular
      # toolchain, then switch this runner to Node 20 and test the same dist.
      - name: Use Node.js 16 for Angular 14
        uses: actions/setup-node@v4
        with:
          node-version: 16.20.2
          cache: npm
          cache-dependency-path: cedar-embeddable-editor/package-lock.json

      - name: Install Angular build dependencies
        working-directory: cedar-embeddable-editor
        run: npm ci

      # Lint runs beside the Angular compiler so both use the supported Node
      # version for this hop. Warnings do not fail the build; the pre-existing
      # `any` debt is baselined per file in .eslintrc.json.
      - name: Lint
        working-directory: cedar-embeddable-editor
        run: npm run lint

      - name: Build the production web component
        working-directory: cedar-embeddable-editor
        run: npm run build:production

      # setup-node changes the executable in PATH but leaves dist untouched.
      # Reinstall under Node 20 in case a test dependency has Node-specific code.
      - name: Use Node.js 20 for Vitest and Playwright
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: |
            cedar-embeddable-editor/package-lock.json
            cedar-embeddable-editor/harness/package-lock.json
            cedar-embeddable-editor/visual/package-lock.json

      - name: Install CEE test dependencies
        working-directory: cedar-embeddable-editor
        run: |
          npm ci
          npm --prefix harness ci
          npm --prefix visual ci
          ./visual/node_modules/.bin/playwright install chromium firefox webkit

      - name: Test the prebuilt Node 16 production artifact
        working-directory: cedar-embeddable-editor
        run: npm run test:ci:prebuilt
