name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - cee-angular-upgrade
      - 'cee-angular-**'

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_STRICT_ALLOW_SCRIPTS: "true"

jobs:
  prepare:
    # arm64 Linux, because the visual suite runs inside Playwright's own container
    # and the runner must not emulate it: `visual/run-in-container.sh` asks for
    # linux/arm64, and a runner that resolves to x86_64 would rasterise text
    # differently and put the baselines quietly back where they were.
    #
    # This was macos-15, pinned because the snapshots were macOS baselines and a
    # runner bump would have moved them underneath us. That pin protected the
    # wrong thing: the baselines were recorded on a laptop and checked here, and
    # the two machines never agreed — 7 of 106 differed by 124 to 393 pixels, a
    # budget of 120 papering over the gap. The container removes the boundary, so
    # the runner no longer has a rendering of its own to defend.
    #
    # macOS also cannot host a Linux container, so this label is what the container
    # requires rather than a preference. A side effect: Playwright's WebKit build
    # for mac14-arm64 was frozen at v2251 against a driver expecting v2336, which
    # broke every newPage() in the webkit-smoke project and forced macos-15. Linux
    # builds are current, so that constraint is gone with the runner.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Check out CEE
        uses: actions/checkout@v7
        with:
          path: cedar-embeddable-editor

      # One Node for the whole job, which Angular 14 could not give us.
      #
      # This job used to build on Node 16 and then switch the runner to Node 20 to
      # test, because Angular 14's toolchain did not support the version Playwright
      # needs. Angular 15 accepts ">=18.10.0", so the split has no reason left and
      # the build and the tests now share one version — which also means the dist
      # that ships is produced on the same Node that exercised it.
      #
      # 20.20.2 carried the march to 21: Angular 17 wanted ">=20.9.0", 18 and 19
      # "^20.11.1", 20 and 21 "^20.19.0". Angular 22 requires "^22.22.3 ||
      # ^24.15.0 || >=26", so this is where it moved, as the previous note said it
      # would have to.
      #
      # 24, not 22, of the two the range allows: 24 is the active LTS and 22 is in
      # maintenance, so this is the version with the longer life rather than the
      # smaller number. 26 does not exist yet.
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: |
            cedar-embeddable-editor/package-lock.json
            cedar-embeddable-editor/harness/package-lock.json
            cedar-embeddable-editor/visual/package-lock.json

      - name: Install Angular build dependencies
        working-directory: cedar-embeddable-editor
        run: npm ci

      - name: Build the production web component
        working-directory: cedar-embeddable-editor
        run: npm run build:production

      # The root `npm ci` is already done above. The harness runs on the runner;
      # visual's host install is used only to stage the same bundle that packaging
      # verifies. Browser execution still installs inside Playwright's container.
      - name: Install CEE test dependencies
        working-directory: cedar-embeddable-editor
        run: |
          npm --prefix harness ci
          npm --prefix visual ci

      - name: Run source and domain gates
        working-directory: cedar-embeddable-editor
        run: npm run test:ci:nonvisual:prebuilt

      - name: Stage and verify the distributable package
        working-directory: cedar-embeddable-editor
        run: |
          npm --prefix visual run prepare:all
          npm run package:npm:prebuilt

      # Deliberately its own step, and deliberately not part of `test:ci`.
      #
      # This is the one check that can start failing without anyone having changed
      # anything: it fails on a disclosure, not on a commit. Inside the gate that
      # would break an unrelated pull request with an error its author cannot fix
      # there, and — worse — would train people to expect a red gate for reasons
      # that are not theirs. As its own step the build still fails, which is the
      # point, and the reason is legible from the job summary alone.
      #
      # After the tests, so a genuine regression is reported first.
      #
      # `--omit=dev` because only runtime dependencies reach the bundle an embedder
      # downloads; the Angular CLI's own tree is a hazard to this machine, not to
      # anyone consuming CEE. `--audit-level=high` because moderate advisories
      # against build tooling are not worth stopping a release for, and the whole
      # value of this step is that a failure means something.
      - name: Audit what ships
        working-directory: cedar-embeddable-editor
        run: npm run audit:prod

      - name: Save the production build for browser shards
        uses: actions/upload-artifact@v7
        with:
          name: cee-production-dist
          path: cedar-embeddable-editor/dist
          if-no-files-found: error
          retention-days: 2

      # The dev publish ships exactly these bytes rather than restaging them, so the
      # package a consumer installs is the package this job verified.
      - name: Save the staged npm package
        uses: actions/upload-artifact@v7
        with:
          name: cee-npm-package
          path: cedar-embeddable-editor/dist-npm/cedar-embeddable-editor
          if-no-files-found: error
          retention-days: 2

  visual:
    name: Visual shard ${{ matrix.shard }}/4
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out CEE
        uses: actions/checkout@v7
        with:
          path: cedar-embeddable-editor

      - name: Restore the tested production build
        uses: actions/download-artifact@v8
        with:
          name: cee-production-dist
          path: cedar-embeddable-editor/dist

      # Every shard uses the pinned browser/font image. The named node_modules
      # volume is runner-local, so parallel jobs cannot contaminate one another.
      - name: Run Playwright shard
        working-directory: cedar-embeddable-editor
        run: bash visual/run-in-container.sh --shard=${{ matrix.shard }}/4

  # Every merge to develop reaches the Nexus dev channel. Until this existed CEE was
  # published only by a release train, so between releases its dev channel stood
  # still while develop moved: on 2026-09-10 the newest dev package was the train's
  # from 09-09 and eight commits had reached no consumer. A local stack asking for the
  # latest dev CEE was served a release-time build, and nothing said so.
  publish-dev:
    name: Publish the dev package
    needs: [prepare, visual]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # One publish at a time, and never cancelled: an npm version is immutable, so a
    # half-finished publish is not something a later run can tidy up.
    concurrency:
      group: publish-dev-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Check out CEE
        uses: actions/checkout@v7
        with:
          path: cedar-embeddable-editor

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0

      - name: Restore the staged npm package
        uses: actions/download-artifact@v8
        with:
          name: cee-npm-package
          path: cedar-embeddable-editor/dist-npm/cedar-embeddable-editor

      # The commit is what makes the version unique. package.json carries the version
      # a release wrote once and leaves it there across every commit until the next
      # release, so two different bundles would otherwise claim the same version.
      - name: Derive the dev version
        id: version
        working-directory: cedar-embeddable-editor
        run: |
          base=$(node -p "require('./package.json').version.split('-')[0]")
          date=$(TZ=UTC git show -s --format=%cd --date=format:%Y%m%d HEAD)
          sha=$(git rev-parse --short=7 HEAD)
          echo "version=${base}-dev.${date}.${sha}" >> "$GITHUB_OUTPUT"

      # The same two secrets every Java repository already uses to reach Nexus, so
      # this needs no new credential. npm 11 ignores a per-registry `_auth`, which
      # reaches the publish as ENEEDAUTH rather than as a rejected credential; the
      # username and a base64 password are the pair it does read. An absent secret is
      # reported here, where it names itself, rather than as that same ENEEDAUTH.
      - name: Point the scope at Nexus
        working-directory: cedar-embeddable-editor
        run: |
          for name in NEXUS_USERNAME NEXUS_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "${name} is empty: the Nexus secret is not available to this repository." >&2
              exit 1
            fi
          done
          {
            echo "//nexus.bmir.stanford.edu/repository/npm-cedar/:username=${NEXUS_USERNAME}"
            echo "//nexus.bmir.stanford.edu/repository/npm-cedar/:_password=$(printf '%s' "${NEXUS_PASSWORD}" | base64 | tr -d '\n')"
            echo "//nexus.bmir.stanford.edu/repository/npm-cedar/:always-auth=true"
          } >> .npmrc
        env:
          NEXUS_USERNAME: ${{ secrets.BMIR_NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.BMIR_NEXUS_PASSWORD }}

      # Re-running a workflow on the same commit must not fail, and must not try to
      # overwrite an immutable version with different bytes.
      - name: Publish unless this commit is already published
        working-directory: cedar-embeddable-editor
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          staged=dist-npm/cedar-embeddable-editor
          name=$(node -p "require('./${staged}/package.json').name")
          if npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
            echo "${name}@${VERSION} is already published; nothing to do."
            exit 0
          fi
          STAGED="${staged}" node -e '
            const fs = require("node:fs");
            const path = `${process.env.STAGED}/package.json`;
            const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
            if (!manifest.name.startsWith("@org.metadatacenter/")) {
              throw new Error(`refusing to publish ${manifest.name} to the dev channel`);
            }
            manifest.version = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + "\n");
          '
          npm publish "./${staged}" --tag dev
          npm view "${name}@${VERSION}" version

